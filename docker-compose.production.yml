services:
  # Next.js Web App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rssfusion-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - CACHE_DRIVER=redis
      - REDIS_URL=redis://redis:6379
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - backup_data:/app/backups
    networks:
      - rssfusion-network

  # Dedicated Background Ingestion Worker
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: rssfusion-worker
    restart: always
    environment:
      - WORKER_DATABASE_URL=${WORKER_DATABASE_URL}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-30000}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-5}
      - WORKER_FETCH_TIMEOUT_MS=${WORKER_FETCH_TIMEOUT_MS:-15000}
      - WORKER_USER_AGENT=${WORKER_USER_AGENT:-RSSFusionBot/1.0}
    depends_on:
      - redis
    networks:
      - rssfusion-network

  # Redis In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: rssfusion-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - redis_data:/data
    networks:
      - rssfusion-network

volumes:
  redis_data:
  backup_data:

networks:
  rssfusion-network:
    driver: bridge
